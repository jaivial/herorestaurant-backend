# Backoffice production vhost (React SSR / vike).
# Served by the backoffice production container on :3011 (plain HTTP;
# TLS terminates here). /bot/ bypasses the SSR proxy and reaches the Go
# backend directly for Evolution webhooks, exactly like the dev vhost.
#
# Prereq: certbot --nginx -d backoffice.alqueriavillacarmen.com
# Install: cp to /etc/nginx/sites-enabled/backoffice.alqueriavillacarmen.conf

map $http_upgrade $connection_upgrade_bo_prod {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name backoffice.alqueriavillacarmen.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name backoffice.alqueriavillacarmen.com;

    ssl_certificate /etc/letsencrypt/live/backoffice.alqueriavillacarmen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backoffice.alqueriavillacarmen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Uploads from the dashboard (menu images, OCR, imports)
    client_max_body_size 50m;

    # Evolution webhooks must bypass the backoffice SSR proxy and reach Go
    # directly (container backend on :8080, network host).
    location /bot/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }

    # SSR pages, /api/admin (proxied internally to Go) and the fichaje
    # WebSocket all go to the backoffice container on :3011.
    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_bo_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
    }

    access_log /var/log/nginx/backoffice.alqueriavillacarmen.access.log;
    error_log /var/log/nginx/backoffice.alqueriavillacarmen.error.log;
}
