# VillaCarmen production vhost — FULL CUTOVER to the Go stack.
# Everything (SPA preact dist + /api/* + legacy root endpoints such as
# confirm_reservation.php) is served by the Go backend container on :8080.
# PHP-FPM is out of the serving path; the legacy webroot stays on disk for
# rollback (restore alqueriavillacarmen.conf.legacy-php.bak + reload).
#
# Install: cp to /etc/nginx/sites-enabled/alqueriavillacarmen.conf

# WebSocket upgrade only when the client asks for it (public Forky /api WS);
# regular requests keep normal Connection semantics.
map $http_upgrade $connection_upgrade_vc {
    default upgrade;
    ''      close;
}

# HTTP redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name alqueriavillacarmen.com www.alqueriavillacarmen.com;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alqueriavillacarmen.com www.alqueriavillacarmen.com;

    # Let's Encrypt (unchanged from the legacy vhost)
    ssl_certificate /etc/letsencrypt/live/alqueriavillacarmen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alqueriavillacarmen.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/alqueriavillacarmen.com/chain.pem;

    ssl_session_cache shared:SSL_VILLA:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_buffer_size 4k;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve X25519:secp384r1;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Compression for HTML/JSON/JS/CSS responses proxied from Go
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_vary on;
    gzip_types application/json text/plain text/css text/javascript application/javascript application/xml image/svg+xml;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Image/menu uploads (backend handles resize via imagemagick)
    client_max_body_size 50m;

    # Everything -> Go backend (SPA + /api + legacy root endpoints).
    # WebSocket upgrade kept for the public Forky assistant (/api/* WS).
    location / {
        limit_req zone=req_limit_global burst=50 nodelay;
        limit_conn conn_limit_global 20;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_vc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }

    access_log /var/log/nginx/alqueriavillacarmen.access.log;
    error_log /var/log/nginx/alqueriavillacarmen.error.log;
}
