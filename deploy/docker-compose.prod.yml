# Production deployment for Villa Carmen (Docker).
# Secrets live in env files outside git:
#   backend/.env.prod      (repo: herorestaurant-backend, untracked)
#   backoffice/.env.prod   (repo: backofficereact, untracked)
# See deploy/DEPLOY-PROD.md for the full runbook.
#
# NOTE ON PATHS: relative paths resolve against this file's directory
# (backend/deploy/), so context ../.. is the multi-repo root
# (/var/www/newvillacarmen) where backend/ + preactvillacarmen/ live side
# by side. Run from anywhere with:
#   sudo docker compose -f /var/www/newvillacarmen/backend/deploy/docker-compose.prod.yml up -d --build
name: newvillacarmen-prod

services:
  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile.prod
    container_name: newvillacarmen-backend-prod
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env.prod
    environment:
      PORT: "8080"
      STATIC_DIR: /app/static
      BOT_CONTEXT_SQLITE_PATH: /var/lib/herorestaurant/whatsapp-bot-context.sqlite
      BOT_PIPELINE_URL: http://127.0.0.1:18195
      # campaign_tools_v1: design engine + email compiler of the backoffice
      # server (host network, backoffice PORT 3011).
      BACKOFFICE_INTERNAL_URL: http://127.0.0.1:3011
    volumes:
      - whatsapp-bot-context:/var/lib/herorestaurant
    # Public frontend dist is baked into the image (no bind mounts in prod).
    depends_on:
      - bot-pipeline

  # DSPy + Jev decision pipeline for the WhatsApp bot (wa_bot_dspy_pipeline_v1).
  # Stateless, localhost-only; provider keys arrive per request from backend.
  bot-pipeline:
    build:
      context: ../pipeline
      dockerfile: Dockerfile
    container_name: newvillacarmen-bot-pipeline-prod
    restart: unless-stopped
    network_mode: host
    environment:
      BOT_PIPELINE_PORT: "18195"
      # wa_bot_laya_heads_v1: classifier = self-hosted Laya heads (Jev
      # protocol). Below this intent confidence the DSPy LLM step decides.
      JEV_URL: http://127.0.0.1:18196/v1/systemone
      JEV_CONFIDENCE_MIN: "0.7"
    depends_on:
      - laya-heads

  # Laya heads (wa_bot_laya_heads_v1): frozen multilingual Laya encoder +
  # linear heads trained on the restaurant's own turns (laya/train_heads.py).
  # Localhost-only, CPU, bounded to 2 cores.
  laya-heads:
    build:
      context: ../laya
    container_name: newvillacarmen-laya-heads-prod
    restart: unless-stopped
    network_mode: host
    cpus: 2
    mem_limit: 3g
    environment:
      LAYA_HEADS_PORT: "18196"
      LAYA_HEADS_THREADS: "2"

  backoffice:
    build:
      context: ../../backoffice
      dockerfile: Dockerfile.prod
    container_name: newvillacarmen-backoffice-prod
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../../backoffice/.env.prod
    depends_on:
      - backend

volumes:
  whatsapp-bot-context:
