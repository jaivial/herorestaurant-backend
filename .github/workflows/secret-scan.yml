name: secret-scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Scan the tracked working tree (not history) so new secrets are blocked
      # without failing forever on already-rotated historical leaks. The leaked
      # values are being rotated separately and the history is purged.
      - name: gitleaks scan
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --no-git --source /repo --redact --no-banner \
            --config /repo/.gitleaks.toml
