# Extend the built-in gitleaks rules and only allow documented placeholders,
# local-only templates and obvious test fixtures. Real secrets must never be
# committed; if gitleaks fails, remove the secret and rotate it.
[extend]
useDefault = true

[allowlist]
description = "Documented placeholders, example templates and test fixtures"
paths = [
  '''(?i)(^|/)\.env(\.[a-z0-9]+)?\.example$''',
  '''(?i)(^|/)\.env\.prod\.example$''',
]
regexes = [
  '''ChangeMe[A-Za-z0-9!@#_-]*''',
  '''(?i)(example|placeholder|dummy|changeme|your[-_]?(key|token|password))''',
  # Fixed, non-secret values used by unit tests.
  '''0123456789abcdefghijklmnop''',
  '''0987654321fedcba987654321''',
  '''sk-ant-minimax-1234567890''',
  # FALSE POSITIVE of the built-in `vault-service-token` rule (case-insensitive
  # `s.` + 24 alphanumerics): Go method references on the Server receiver such
  # as `s.handleBOGroupMenusV2List` match that legacy Vault token shape. The
  # pattern requires an UPPERCASE letter right after `handle`, and real legacy
  # Vault tokens are lowercase-only, so no genuine token is exempted.
  '''s\.handle[A-Z][A-Za-z0-9]*''',
]
